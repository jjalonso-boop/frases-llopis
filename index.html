<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pensamientos para cada día</title>
    <link rel="manifest" href="manifest.json">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e0c3fc; /* Color base para evitar saltos blancos */
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            padding: 40px;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Capa de fondo fija que no se reinicia al hacer clic */
        .fondo-animado {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(-45deg, #e0c3fc, #8ec5fc, #e2d1c3, #fbc2eb);
            background-size: 300% 300%;
            animation: gradienteFluido 20s ease infinite;
            will-change: background-position;
        }

        @keyframes gradienteFluido {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #contenedor {
            max-width: 800px; 
            width: 90%;
            transition: opacity 0.4s ease;
            pointer-events: none;
            opacity: 1;
        }

        #frase {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem;
            color: #2c3e50;
            line-height: 1.5;
            margin: 0;
            font-weight: 200;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.4);
        }

        .instruccion {
            position: absolute;
            bottom: 30px;
            font-size: 0.85rem;
            color: #4a5568;
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            #frase {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="fondo-animado"></div>

    <div id="contenedor">
        <p id="frase">Cargando...</p>
    </div>

    <div class="instruccion">Toca para meditar otra frase</div>

    <!-- Carga limpia del script de frases -->
    <script src="frases.js"></script>

    <script> 
        let cargando = false;

        function nuevaFrase() { 
            if (cargando) return; 
            
            const elemento = document.getElementById("frase"); 
            const contenedor = document.getElementById("contenedor");

            if (typeof frases === 'undefined' || !frases.length) { 
                setTimeout(nuevaFrase, 100);
                return; 
            } 

            cargando = true;
            const indiceAleatorio = Math.floor(Math.random() * frases.length); 
            
            // Transición limpia de desvanecimiento solo en el texto
            contenedor.style.opacity = 0; 

            setTimeout(() => { 
                elemento.textContent = frases[indiceAleatorio]; 
                contenedor.style.opacity = 1; 
                cargando = false;
            }, 400); 
        } 

        // Escuchadores de eventos optimizados
        window.addEventListener('DOMContentLoaded', nuevaFrase);
        document.body.addEventListener('click', nuevaFrase);
    </script> 
</body>
</html>
