<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pensamientos para cada día</title>
    <link rel="manifest" href="manifest.json">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Fondo gris/azul noche sofisticado */
            background: radial-gradient(circle at center, #1f2430 0%, #0f111a 100%);
            
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            padding: 40px;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        #contenedor {
            max-width: 800px; 
            width: 90%;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
        }

        #frase {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem;
            color: #f8f9fa;
            line-height: 1.5;
            margin: 0;
            font-weight: 200;
            letter-spacing: 1px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .instruccion {
            position: absolute;
            bottom: 30px;
            font-size: 0.85rem;
            color: #a0a8b9;
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            #frase {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div id="contenedor">
        <p id="frase">Cargando...</p>
    </div>

    <div class="instruccion">Toca para meditar otra frase</div>

    <script>
        document.write('<script src="frases.js?v=' + Date.now() + '"><\/script>');
    </script>

    <script> 
        let cargando = false;

        function nuevaFrase() { 
            if (cargando) return; 
            
            const elemento = document.getElementById("frase"); 
            const contenedor = document.getElementById("contenedor");

            if (typeof frases === 'undefined') { 
                setTimeout(nuevaFrase, 200);
                return; 
            } 

            if (frases.length > 0) { 
                cargando = true;
                const indiceAleatorio = Math.floor(Math.random() * frases.length); 
                
                contenedor.style.opacity = 0; 

                setTimeout(() => { 
                    elemento.textContent = frases[indiceAleatorio]; 
                    contenedor.style.opacity = 1; 
                    cargando = false;
                }, 500); 
            } 
        } 

        window.onload = nuevaFrase;
        document.body.addEventListener('click', nuevaFrase);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                cargando = false; 
                nuevaFrase();
            }
        });

        window.onpageshow = function(event) {
            cargando = false;
            if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                window.location.reload();
            } else {
                nuevaFrase();
            }
        };
    </script> 
</body>
</html>
